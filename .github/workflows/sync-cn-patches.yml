name: Auto-Sync CN Patches & Operators Localization

on:
  schedule:
    # Runs at 04:00 UTC on the 1st and 15th of every month (every 2 weeks)
    - cron: '0 4 1,15 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-cn-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CN Patches & Localization Sync Script
        run: node scripts/sync-cn-patches.js

      - name: Verify TypeScript compilation & Vite build
        run: npm run build

      - name: Commit and push if changes detected
        run: |
          if [ -n "$(git status --porcelain src/data/translations/cnOperatorsComplete.ts src/data/eventsData.ts)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/translations/cnOperatorsComplete.ts src/data/eventsData.ts
            git commit -m "chore(cn): auto-sync newly released CN operators and banner schedules [skip ci]"
            git push origin main
            echo "✓ Successfully pushed updated CN operators and banners to main branch."
          else
            echo "No new CN operator or banner updates detected. Repository is up to date."
          fi
