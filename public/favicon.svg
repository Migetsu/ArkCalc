<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Cyan Glowing Blade Gradient -->
    <linearGradient id="cyanBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Cyan Facet Gradient -->
    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Golden Amber Core Gradient -->
    <linearGradient id="amberCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Radial Glow Behind Logo -->
    <radialGradient id="neonGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- App Rounded Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="30" r="22" fill="url(#neonGlow)" />

  <!-- Tactical Background Grid Dots (Rhodes Island aesthetic) -->
  <circle cx="12" cy="12" r="1" fill="#38bdf8" opacity="0.3" />
  <circle cx="52" cy="12" r="1" fill="#38bdf8" opacity="0.3" />
  <circle cx="12" cy="52" r="1" fill="#38bdf8" opacity="0.3" />
  <circle cx="52" cy="52" r="1" fill="#38bdf8" opacity="0.3" />

  <!-- Top Diamond Prism Facet -->
  <polygon points="32,9 42,20 32,27 22,20" fill="url(#cyanFacet)" opacity="0.4" />

  <!-- Left Wing / Blade of "A" -->
  <path d="M32,9 L14,45 L22,48 L32,24 Z" fill="url(#cyanBlade)" />

  <!-- Right Wing / Blade of "A" -->
  <path d="M32,9 L50,45 L42,48 L32,24 Z" fill="url(#cyanFacet)" />

  <!-- Inner Center Hexagon Cutout -->
  <polygon points="32,24 39,35 32,44 25,35" fill="#090d16" stroke="#00f0ff" stroke-width="1.5" />

  <!-- Golden Originium Core Prism -->
  <polygon points="32,29 36,35 32,41 28,35" fill="url(#amberCore)" />

  <!-- Bottom Tactical Chevron (Promotion / Elite rank) -->
  <path d="M25,52 L32,57 L39,52" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Corner Tech Accents -->
  <circle cx="32" cy="9" r="1.5" fill="#ffffff" />
</svg>
